# Compile gate for the paths CI cannot execute.
#
# GitHub runners have no GPU, so TensorRT, DALI and the CUDA kernels can never be
# *run* here — but they can be *compiled*, and until this workflow existed they
# were not: src/backends/tensorrt_backend.cpp and src/gpu/ were built for the
# first time on a rented GPU box, where a -Werror wall of sign-conversion and
# TensorRT 10 deprecation errors burned gate time that was paid for by the hour.
#
# The job stages headers-only TensorRT and DALI prefixes (see
# scripts/ci/stage_gpu_headers.sh) and builds the static library target with
# -DWERROR=ON. It does not link and does not run: manual verification of the GPU
# path is still the gate, per .claude/skills/gpu-verify/SKILL.md.
name: GPU Backend Compile

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  compile:
    # Pinned: scripts/ci/stage_gpu_headers.sh pulls from the ubuntu2404 CUDA repo.
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }} (compile, -DWERROR=ON)
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two GPU halves are independent options, so each combination is a
          # distinct set of #if branches. Build all four.
          - name: TensorRT
            options: -DUSE_DALI=OFF -DUSE_CUDA_POSTPROCESS=OFF
          - name: TensorRT + DALI
            options: -DUSE_DALI=ON -DUSE_CUDA_POSTPROCESS=OFF
          - name: TensorRT + CUDA postprocess
            options: -DUSE_DALI=OFF -DUSE_CUDA_POSTPROCESS=ON
          - name: TensorRT + full GPU pipeline
            options: -DUSE_GPU_PIPELINE=ON
          # Forward compat: the same full build against TENSORRT_COMPAT_VERSION,
          # the newest TensorRT, before anything pins it.
          - name: TensorRT (compat) + full GPU pipeline
            options: -DUSE_GPU_PIPELINE=ON
            trt_headers: compat
          # Backward compat: the previous stack, TENSORRT_LEGACY_VERSION (TensorRT
          # 10.x, weak typing and BuilderFlag::kFP16) with DALI_LEGACY_VERSION (1.x).
          - name: TensorRT 10 + DALI 1 (legacy) + full GPU pipeline
            options: -DUSE_GPU_PIPELINE=ON
            trt_headers: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps

      - name: Restore staged GPU headers
        uses: actions/cache@v4
        with:
          path: ~/dependencies
          # versions.env and versions.sh determine the TensorRT/DALI versions the
          # staging script resolves, so both must key the cache or a version bump
          # would silently reuse the previously staged headers.
          # The compat job stages a different TensorRT, so it keys its own cache.
          key: gpu-headers-${{ matrix.trt_headers || 'pinned' }}-${{ hashFiles('scripts/ci/stage_gpu_headers.sh', 'scripts/versions.sh', 'versions.env') }}

      - name: Stage TensorRT and DALI headers
        env:
          TRT_HEADERS: ${{ matrix.trt_headers || 'pinned' }}
        run: ./scripts/ci/stage_gpu_headers.sh

      # The toolkit must be the one versions.env pins, since stage_gpu_headers.sh
      # derives the TensorRT package coordinates (…-1+cuda<v>) from the same value.
      # Hardcoding it here would let a CUDA_VERSION bump compile the newly pinned
      # TensorRT headers against the old toolkit.
      - name: Install nvcc and the CUDA runtime headers
        run: |
          source scripts/versions.sh
          apt_suffix="${CUDA_VERSION//./-}"        # 13.0 -> 13-0
          echo "Installing CUDA ${CUDA_VERSION} (apt suffix ${apt_suffix})"
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "cuda-nvcc-${apt_suffix}" "cuda-cudart-dev-${apt_suffix}"
          echo "/usr/local/cuda-${CUDA_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          source scripts/versions.sh
          trt_root="$HOME/dependencies/tensorrt-headers"
          dali_root="$HOME/dependencies/dali-headers"
          trt_version_args=()
          if [[ "${{ matrix.trt_headers }}" == compat ]]; then
            trt_root="$HOME/dependencies/tensorrt-compat-headers"
            trt_version_args=(-DTENSORRT_VERSION="${TENSORRT_COMPAT_VERSION}")
          elif [[ "${{ matrix.trt_headers }}" == legacy ]]; then
            trt_root="$HOME/dependencies/tensorrt-legacy-headers"
            dali_root="$HOME/dependencies/dali-legacy-headers"
            trt_version_args=(-DTENSORRT_VERSION="${TENSORRT_LEGACY_VERSION}")
          fi
          cmake -S . -B build -G Ninja \
            -DUSE_ONNX_RUNTIME=OFF -DUSE_TENSORRT=ON ${{ matrix.options }} \
            -DTENSORRT_ROOTDIR="${trt_root}" "${trt_version_args[@]}" \
            -DDALI_ROOT="${dali_root}" \
            -DCMAKE_BUILD_TYPE=Release -DWERROR=ON \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile
        # The static library only. The staged TensorRT/DALI shared objects are
        # stubs with no symbols, so any target that links is out of reach here.
        run: cmake --build build --parallel --target rfdetr_inference_lib
