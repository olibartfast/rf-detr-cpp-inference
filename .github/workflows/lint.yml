name: C++ Lint & Build

# Every job here is a release gate: formatting, clang-tidy, cppcheck and strict
# warnings must all pass before a release is tagged, and they run again on the
# `v*` tag itself (see `on.push.tags`).
#
# The runner image is pinned to Ubuntu 24.04 because this repository pins clang 18
# for formatting and static analysis (AGENTS.md -> Code Quality). `ubuntu-latest`
# moved to Ubuntu 26.04 in October 2026, which ships clang 20/21/22 only, so the
# `clang-format-18` / `clang-tidy-18` binaries vanished and both jobs failed with
# exit 127. The tools are installed explicitly below rather than taken from the
# image, so the jobs fail loudly if they ever disappear again instead of running
# a different clang. Build/test coverage of the newest Ubuntu stays in ci.yml,
# which intentionally keeps `ubuntu-latest`.

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master, develop]

jobs:
  version-sync:
    name: Version Sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # versions.env is the single source of truth for third-party pins. CMake and
      # the shell scripts read it directly; the backend Dockerfiles, conanfile.txt and
      # the deploy/ Python tooling cannot, so they restate it and this check fails when
      # the restatement drifts.
      - name: Check pins against versions.env
        run: ./scripts/check_version_sync.sh

      # The three backend Dockerfiles triplicate the blocks that must stay identical
      # (toolchain, media packages, source COPY, runtime tail) under shared: markers;
      # this fails when a shared block drifts between them.
      - name: Check Dockerfile shared blocks
        run: ./scripts/check_dockerfile_parity.sh

  format-check:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          clang-format-18 --version

      - name: Check formatting
        run: |
          find src tests -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-format-18 --dry-run --Werror

  clang-tidy:
    name: Clang-Tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps

      - name: Install clang-tidy 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18
          clang-tidy-18 --version

      - name: Generate compile_commands.json
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run clang-tidy
        run: |
          find src -name '*.cpp' ! -name 'tensorrt_backend.cpp' | \
            xargs clang-tidy-18 -p build

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --check-level=exhaustive --std=c++20 --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=unusedFunction \
            -I src src/

  build-warnings:
    name: Build with Strict Warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deps

      - name: Configure with -DWERROR=ON
        run: cmake -S . -B build -DWERROR=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build
